[package]
name = "hdmi-splitscreen"
version = "1.0.0"
edition = "2021"
authors = ["Mikaël Côté"]
description = "Split screen faible latence : deux entrées de capture USB côte à côte"

[dependencies]
eframe = { version = "0.31", default-features = false, features = ["glow", "default_fonts", "wayland", "x11"] }
nokhwa = { version = "0.10", default-features = false, features = ["input-native"] }
zune-jpeg = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["png", "ico"] }
parking_lot = "0.12"
egui = { version = "0.31", features = ["bytemuck"] }
bytemuck = { version = "1", features = ["extern_crate_alloc"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_System_Com"] }

[build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
